version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_AI_API_BASE_URL: ${NEXT_PUBLIC_AI_API_BASE_URL}
        NEXT_PUBLIC_WEB_API_BASE_URL: ${NEXT_PUBLIC_WEB_API_BASE_URL}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_KAKAO_JS_KEY: ${NEXT_PUBLIC_KAKAO_JS_KEY}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NEXT_PUBLIC_NAVER_CLIENT_ID}
    container_name: reelstamp-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 환경 변수는 .env 파일에서 로드하거나 여기에 직접 설정
      # - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      # - PAYAPP_USERID=${PAYAPP_USERID}
      # - PAYAPP_LINKKEY=${PAYAPP_LINKKEY}
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - reelstamp-network

networks:
  reelstamp-network:
    driver: bridge
